# SEMAR-GPT deployment configuration
# Built on LibreChat. Documentation: https://www.librechat.ai/docs/configuration/librechat_yaml
#
# This file is intentionally kept small: every key below is optional except `version`.
# Provider credentials belong in `.env`; see README.SEMAR-GPT.md for the supported keys.

version: 1.3.18

# Conversation search. The bundled docker-compose stack ships Meilisearch.
cache: true

interface:
  # Shown on the welcome screen before the first message.
  customWelcome: 'Selamat datang di SEMAR-GPT — asisten AI Anda untuk berpikir, menulis, dan berkarya.'
  # Show the time-of-day greeting (and the text above) instead of an endpoint name.
  landingHeading: greeting
  # Keep the deployment footer and policy links on the welcome screen.
  landingFooter: true

  # SEMAR-GPT palette: deep navy and teal, with a warm gold mark.
  # Only the roles that differ from the LibreChat defaults are listed.
  theme:
    version: 1
    name: semar-gpt
    modes:
      light:
        colors:
          rgb-accent-primary: '13 148 136'
          rgb-accent-primary-hover: '15 118 110'
          rgb-link: '13 116 116'
          rgb-link-hover: '15 118 110'
          rgb-ring-primary: '13 148 136'
          rgb-focus-control: '15 118 110'
          rgb-border-field-focus: '13 148 136'
          rgb-surface-submit: '13 148 136'
          rgb-surface-submit-hover: '15 118 110'
          rgb-surface-primary-alt: '248 250 252'
          rgb-surface-sidebar: '248 250 252'
        appearance:
          controlRadius: '0.625rem'
      dark:
        colors:
          rgb-accent-primary: '45 212 191'
          rgb-accent-primary-hover: '94 234 212'
          rgb-link: '94 234 212'
          rgb-link-hover: '153 246 228'
          rgb-ring-primary: '45 212 191'
          rgb-focus-control: '94 234 212'
          rgb-border-field-focus: '45 212 191'
          rgb-surface-submit: '13 148 136'
          rgb-surface-submit-hover: '15 118 110'
          rgb-surface-primary-alt: '15 23 42'
          rgb-surface-sidebar: '15 23 42'
          rgb-header-primary: '15 23 42'
        appearance:
          controlRadius: '0.625rem'

  # Chat features
  # File search needs the RAG API and an embedding provider; enable it after
  # setting RAG_OPENAI_API_KEY (or another embedding backend) in `.env`.
  fileSearch: false
  modelSelect: true
  parameters: true
  presets: true
  bookmarks: true
  multiConvo: true
  prompts:
    use: true
    create: true
    share: false
    public: false
  agents:
    use: true
    create: true
    share: false
    public: false
  # Skills catalog. Deployment skills (`skill/`) and Agent Plugins (`plugin/`)
  # load at API startup and appear here. Users may author their own skills;
  # sharing is limited to the owner until an operator enables it.
  skills:
    use: true
    create: true
    share: false
    public: false
  # Memories let a partner keep confirmed preferences across conversations.
  # Only explicitly confirmed facts are stored; each user can clear them.
  memories: true
  # Scheduled tasks are experimental and off by default upstream, so enable
  # them explicitly. The bundled stack runs a single API process and sets
  # SCHEDULES_SINGLE_PROCESS=true in `.env`; see docs/cindy-integration.md.
  schedules:
    use: true
    create: true
  # The default LibreChat mascot is disabled; SEMAR-GPT uses its own identity.
  mascot: false

# ---------------------------------------------------------------------------
# Model gateway
# ---------------------------------------------------------------------------
# Midas-stage exposes an OpenAI Responses-compatible endpoint at
# /karpathy/responses. Set AI_GATEWAY_API_KEY in the API environment (Railway).
#
# Any other OpenAI-compatible server (vLLM, Ollama, LiteLLM, OpenRouter, an
# internal gateway, ...) can be added the same way.
endpoints:
  custom:
    - name: 'AI Gateway'
      apiKey: '${AI_GATEWAY_API_KEY}'
      baseURL: 'https://midas-stage.telkomdigital.id/karpathy'
      models:
        default:
          - 'midas/gpt-5.5'
        fetch: false
      titleConvo: true
      titleModel: 'midas/gpt-5.5'
      modelDisplayLabel: 'Midas Gateway'

# ---------------------------------------------------------------------------
# Branded presets on the welcome screen
# ---------------------------------------------------------------------------
modelSpecs:
  prioritize: true
  list:
    - name: 'semar-gpt'
      label: 'SEMAR-GPT'
      description: 'Asisten AI serbaguna untuk menulis, menganalisis, dan berkarya.'
      showOnLanding: true
      preset:
        endpoint: 'AI Gateway'
        model: 'midas/gpt-5.5'
        useResponsesApi: true
        instructions: |
          Anda adalah SEMAR-GPT, asisten AI yang ramah, teliti, dan ringkas.
          Jawab dalam bahasa yang digunakan pengguna. Jika tidak yakin, katakan
          demikian dan tawarkan langkah berikutnya. Jangan mengarang fakta.
    - name: 'semar-gpt-fast'
      label: 'SEMAR-GPT Cepat'
      description: 'Jawaban cepat untuk pertanyaan sehari-hari.'
      showOnLanding: true
      preset:
        endpoint: 'AI Gateway'
        model: 'midas/gpt-5.5'
        useResponsesApi: true
        instructions: |
          Anda adalah SEMAR-GPT, asisten AI yang ramah, teliti, dan ringkas.
          Jawab dalam bahasa yang digunakan pengguna. Jika tidak yakin, katakan
          demikian dan tawarkan langkah berikutnya. Jangan mengarang fakta.
